version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint # %w, errors.Is and errors.As rather than == and type asserts
    - nilerr # returning nil after checking err != nil
    - bodyclose
    - noctx # an HTTP request made without a context
    - copyloopvar
    - unconvert
    - gosec
    - revive
    - misspell
    - nolintlint

  settings:
    revive:
      rules:
        - name: exported # every exported identifier carries a doc comment
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
        - name: unused-parameter

    nolintlint:
      require-explanation: true
      require-specific: true

    gosec:
      excludes:
        # G124 wants Secure written as a literal true on every http.Cookie, and
        # the session cookie takes it from SPRIG_COOKIE_SECURE. A test in
        # internal/auth asserts the attributes instead.
        - G124

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ismailshak/sprig
