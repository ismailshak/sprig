[env]
# Defaults to the compose database, unless the shell overrides it.
SPRIG_DATABASE_URL = "{{ env.SPRIG_DATABASE_URL | default(value='postgres://sprig:sprig@localhost:5432/sprig?sslmode=disable') }}"

[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
node = "26.8.1"
pnpm = "11.25.0"

# The app runs goose as a library over an embed.FS at startup, so the image does
# not contain this binary.
"go:github.com/pressly/goose/v3/cmd/goose" = "v3.28.0"

[tasks.build]
description = "Build the server binary at ./sprig"
run = "go build -o sprig ./cmd/sprig"

[tasks.seed]
description = "Load the prototype's garden into the dev database"
run = "go run ./cmd/seed"

[tasks.test]
description = "Run the Go tests. The query layer's tests need a Postgres running"
# The dev tag compiles the development sign-in in, and everything else is the
# same in both builds. A test in cmd/sprig builds the untagged binary and
# checks the sign-in is absent from it.
run = "go test -tags dev ./..."

[tasks.e2e]
description = "Run the Playwright suite against the built image and a throwaway database"
dir = "e2e"
run = "pnpm test"

[tasks.lint]
description = "Run golangci-lint over the whole module, and check the generated queries are current"
run = ["sqlc diff", "golangci-lint run"]

# The app applies its own migrations at startup.
[tasks.migrate]
description = "Apply outstanding migrations to SPRIG_DATABASE_URL"
run = "goose -dir db/migrations postgres \"$SPRIG_DATABASE_URL\" up"

[tasks."migrate:new"]
description = "Create the next numbered migration in db/migrations"
usage = 'arg "<name>" help="What the migration does, in snake_case"'
run = 'goose -dir db/migrations -s create "${usage_name?}" sql'
