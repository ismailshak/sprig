[env]
# Defaults to the compose database, unless the shell overrides it.
SPRIG_DATABASE_URL = "{{ env.SPRIG_DATABASE_URL | default(value='postgres://sprig:sprig@localhost:5432/sprig?sslmode=disable') }}"

# The htmx release vendored under web/static/vendor, pinned here so Renovate
# can bump it. mise run vendor:htmx fetches that release and replaces the file.
[vars]
htmx = "2.0.10"

[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
node = "26.8.2"
pnpm = "11.27.0"

"go:github.com/pressly/goose/v3/cmd/goose" = "v3.28.0" # Only the migrate tasks need the binary because the app runs goose as a library at startup
"go:github.com/bokwoon95/wgo" = "v0.7.1" # Only the dev task uses wgo, which restarts the server when a file changes
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"

[tasks.build]
description = "Build the server binary at ./sprig"
run = "go build -o sprig ./cmd/sprig"

[tasks."dev:stop"]
description = "Stop the Postgres container the dev task leaves running"
run = "docker compose stop db"

[tasks."dev:reset"]
description = "Delete the dev database and load the seed into a fresh one"
run = [
  # --volumes deletes the db-data volume the database lives in
  "docker compose down --volumes",
  "docker compose up -d --wait db",
  "mise run seed",
]

[tasks.seed]
description = "Load the seed gardens into the dev database"
run = "go run ./cmd/seed"

[tasks.lint]
description = "Run golangci-lint over the whole module, and check the generated queries are current"
run = ["sqlc diff", "golangci-lint run"]

[tasks.vulncheck]
description = "Report the known vulnerabilities the module's code can reach"
run = "govulncheck -tags dev ./..."

# The app applies its own migrations at startup.
[tasks.migrate]
description = "Apply outstanding migrations to SPRIG_DATABASE_URL"
run = "goose -dir db/migrations postgres \"$SPRIG_DATABASE_URL\" up"

[tasks."migrate:new"]
description = "Create the next numbered migration in db/migrations"
usage = 'arg "<name>" help="What the migration does, in snake_case"'
run = 'goose -dir db/migrations -s create "${usage_name?}" sql'

[tasks."generate"]
description = "Regenerate the sqlc queries in internal/store from db/queries"
run = "sqlc generate"

[tasks.format]
description = "Format the e2e subproject, the app's JavaScript and the markdown at the root with prettier"
dir = "e2e"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm run format",
  # The app's scripts and the root markdown are outside this directory, so
  # they are named here and given the same config. The script glob does not
  # reach the vendored htmx. That is a directory below, under web/static/vendor.
  "pnpm exec prettier --write --config .prettierrc.json ../web/static/*.js ../*.md",
]

[tasks.hooks]
description = "Point git at the hooks in .githooks, which is a per-clone setting"
run = "git config core.hooksPath .githooks"

[tasks.sweep]
description = "Delete the rows no page shows and the photo files no row points at, against the dev database"
# The sweep loads the whole server config. It uses no cookie, but the config
# rejects the default __Host- cookie name unless the cookie is Secure, and
# rejects a Secure cookie with an http base URL.
env = { SPRIG_COOKIE_SECURE = "false", SPRIG_COOKIE_NAME = "sprig_session" }
run = "go run ./cmd/sprig sweep"

[tasks.admin]
description = "Run sprig admin against the dev database: mise run admin invite --user <handle>"
usage = 'arg "<args>..." var=#true help="Passed to sprig admin, such as invite --user emma"'
env = { SPRIG_COOKIE_SECURE = "false", SPRIG_COOKIE_NAME = "sprig_session" }
run = 'eval "set -- $usage_args"; go run ./cmd/sprig admin "$@"'
