name: sprig

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sprig
      POSTGRES_PASSWORD: sprig
      POSTGRES_DB: sprig
    # Tests set this to 127.0.0.1::5432 so Docker picks a free host port
    ports:
      - "${DB_PORTS:-5432:5432}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sprig -d sprig"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  # Behind a profile because the development loop only starts Postgres.
  # This service is mainly for the e2e suite.
  app:
    profiles: [app]
    # Fixed tag, so up without --build starts this image rather than whatever has the default name
    image: sprig-app:dev
    build:
      context: .
      args:
        # The development build is not compiled to the default image location
        DIST: dist/dev
    environment:
      SPRIG_DATABASE_URL: postgres://sprig:sprig@db:5432/sprig?sslmode=disable
      SPRIG_LOG_FORMAT: text
      # The origin a passkey ceremony is checked against. It has to be the URL
      # the browser reaches the app at, port included, so the e2e task fixes the
      # host port per stack and passes it in here.
      SPRIG_BASE_URL: ${SPRIG_BASE_URL:-http://localhost:8080}
      # Secure is off because WebKit refuses a Secure cookie over plain http
      # and the suite has no TLS. The __Host- prefix is dropped because it is
      # only valid on a Secure cookie.
      SPRIG_COOKIE_SECURE: "false"
      SPRIG_COOKIE_NAME: sprig_session
      # On, so the e2e suite can reach Set up your garden on a database the
      # seed has already put an account in. A deployment leaves it off.
      SPRIG_SIGNUP_ENABLED: "true"
      # On, so the Notifications page shows its form to the e2e suite. The
      # pair is only for this stack and signs nothing: no test subscribes,
      # because a browser under Playwright has no push service to reach.
      SPRIG_PUSH_ENABLED: "true"
      SPRIG_VAPID_PUBLIC_KEY: BIKy0ljeIkYXaxRwCtYWzL6mcXZ1uQRljQ9HlisKJLJiAWkvTHx6QKQNtjbZeP5AvsVqD6-lKh6RDeyszC8lu3A
      SPRIG_VAPID_PRIVATE_KEY: NYvCfU2w94nee-zA8CqDtHNwV7z9nKVjO3JyESW9mcs
      SPRIG_VAPID_SUBJECT: mailto:sprig@example.com
      # A tmpfs the app can write to. The image runs as nonroot, which cannot
      # create the default ./photos at the container's root.
      SPRIG_PHOTO_DIR: /photos
    tmpfs:
      - /photos
    ports:
      - "${APP_PORTS:-8080:8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
