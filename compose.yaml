name: sprig

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sprig
      POSTGRES_PASSWORD: sprig
      POSTGRES_DB: sprig
    # Tests set this to 127.0.0.1::5432 so Docker picks a free host port
    ports:
      - "${DB_PORTS:-5432:5432}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprig -d sprig"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  # Behind a profile because the development loop only starts Postgres.
  # This service is mainly for the e2e suite.
  app:
    profiles: [app]
    # Fixes the tag because up without --build starts whatever image carries this name
    image: sprig-app:dev
    build:
      context: .
      args:
        # The suite signs in through the development sign-in, which only a dev build has
        GO_TAGS: dev
    environment:
      SPRIG_DATABASE_URL: postgres://sprig:sprig@db:5432/sprig?sslmode=disable
      SPRIG_LOG_FORMAT: text
      # The session cookie drops Secure because WebKit refuses one over plain
      # http and the suite has no TLS. The name loses its __Host- prefix, which
      # is valid only on a Secure cookie.
      SPRIG_COOKIE_SECURE: "false"
      SPRIG_COOKIE_NAME: sprig_session
    ports:
      - "${APP_PORTS:-8080:8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
