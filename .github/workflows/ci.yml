name: CI
# A push to main runs the same four jobs as a pull request and then publishes
# the :main image, so the tip ships only from a commit that passed them. The
# push run also writes the caches pull requests read, because a cache written
# on a pull request branch is only readable from that branch. A version tag
# runs the Release workflow instead.
#
# workflow_dispatch exists so the htmx vendoring workflow can start a run on a
# Renovate branch after pushing the vendored file to it. A push made with the
# workflow token doesn't start a pull_request run, so that head would go unchecked.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request cancels a superseded run because a cancelled push leaves its caches unwritten
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Lint project
        run: mise run lint
      # A Renovate pull request is skipped here because its pull_request run
      # starts before the vendored file is pushed to the branch. The run
      # dispatched after that push checks the branch instead.
      - name: Check the vendored htmx is the release mise.toml pins
        if: github.event.pull_request.user.login != 'renovate[bot]'
        run: |
          mise run vendor:htmx
          git add --intent-to-add web/static/vendor
          git diff --stat --exit-code -- web/static/vendor

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Run tests
        run: mise run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-go
      - name: Cache the browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # The lockfile pins the Playwright version, which pins the browser build
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Install the browsers and their system libraries
        run: |
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e run browsers
      - name: Run the suite
        run: mise run e2e
        env:
          # One stack per worker, on a four-core runner
          SPRIG_E2E_WORKERS: 4
      # A test that fails and then passes on the retry leaves the job green. The trace
      # of the failed attempt is only kept if this step runs on a green run too.
      - name: Keep the traces and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-go
      - name: Compile the binaries
        run: mise run build:image
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    needs: [lint, test, e2e, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # go build reads the version from the nearest tag. A shallow clone does not fetch tags.
          fetch-depth: 0
      - name: Set up the toolchain
        uses: ./.github/actions/setup-go
      - name: Compile the binaries
        run: mise run build:image
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The branch name as the tag, so a main push updates :main
          tags: type=ref,event=branch
          flavor: latest=false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
