name: CI
# A push to main or a version tag runs the same four jobs and then publishes, so
# an image ships only from a commit they passed. The push run also writes the
# caches a pull request reads, because a cache written on a pull request branch is
# readable from that branch alone.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request cancels a superseded run because a cancelled push leaves its caches unwritten or a tag unpublished
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Lint project
        run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Run tests
        run: mise run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-go
      - name: Cache the browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # The lockfile pins the Playwright version, which pins the browser build
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Install the browser and its system libraries
        run: |
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps webkit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Built here rather than through compose because this action reads and writes the Actions layer cache
      - name: Build the image the suite runs
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: GO_TAGS=dev
          load: true
          tags: sprig-app:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the suite
        run: mise run e2e --no-build
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [lint, test, e2e, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # go build takes the version off the tag, which a shallow clone leaves behind.
          fetch-depth: 0
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A v0.1.0 push publishes 0.1.0, 0.1 and 0. A main push moves the :main tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
          flavor: latest=false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # cache-from alone because the image job wrote this run's layers already
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
