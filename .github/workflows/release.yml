name: Release
# A v* tag builds the image, pushes it to GHCR as the version, its minor, its
# major and latest, and creates the GitHub release when the tag has none. No
# checks run here, because the tag has to be on main and every commit on main
# passed CI in its pull request and again on the push.
on:
  push:
    tags: ["v*"]

concurrency:
  # One release at a time. Two tags pushed close together would otherwise leave latest on whichever build finished last
  group: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The last step creates the release
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # go build reads the version from the tag and the next step reads main's history.
          # A shallow clone has neither.
          fetch-depth: 0
      # A tag on a branch commit would publish a version that never went through a pull request.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 publishes 0.1.0, 0.1 and 0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest follows the tag pushed last, not the highest version
          flavor: latest=auto
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from. A published image is built from scratch so a stale cached layer cannot get into it
      # A tag cut with gh release create already has a release. A tag pushed with git gets one here,
      # with notes from the merged pull request titles. It is the last step because a release must
      # not name an image that is not on GHCR yet.
      - name: Create the release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
