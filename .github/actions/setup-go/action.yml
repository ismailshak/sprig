name: Set up Go
description: Installs the toolchain with mise, then restores the module and build caches.

runs:
  using: composite
  steps:
    - name: Install toolchain
      uses: jdx/mise-action@v4
      with:
        version: 2026.9.1
        install: true
        cache: true
    - name: Locate the Go caches
      id: paths
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go modules and build output
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.paths.outputs.mod }}
          ${{ steps.paths.outputs.build }}
        # mise.toml is in the key because it owns the Go version the cache was built with
        key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
